services:
  api:
    build: .
    image: svg-contour-normalizer:latest
    container_name: svg-contour-normalizer
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/svgpaths.db
    volumes:
      - svgpath-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  svgpath-data:
